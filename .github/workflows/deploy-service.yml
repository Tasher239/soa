name: Deploy Service

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: hw1_c4/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/soa-api:${{ github.sha }}

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 --decode > $HOME/.kube/config

      - name: Set namespace
        run: |
          kubectl create namespace project-prj-1774037146422854262 --dry-run=client -o yaml | kubectl apply --validate=false -f -

      - name: Deploy manifests
        run: |
          sed "s#IMAGE_PLACEHOLDER#ghcr.io/${{ github.repository_owner }}/soa-api:${{ github.sha }}#g" k8s/api/deployment.yaml | kubectl -n project-prj-1774037146422854262 apply --validate=false -f -
          kubectl -n project-prj-1774037146422854262 apply --validate=false -f k8s/api/service.yaml
