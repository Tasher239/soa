version: "3.9"

services:
  booking-db:
    image: postgres:16-alpine
    container_name: hw3_booking_db
    environment:
      POSTGRES_DB: ${BOOKING_DB_NAME}
      POSTGRES_USER: ${BOOKING_DB_USER}
      POSTGRES_PASSWORD: ${BOOKING_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - booking_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BOOKING_DB_USER} -d ${BOOKING_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  flight-db:
    image: postgres:16-alpine
    container_name: hw3_flight_db
    environment:
      POSTGRES_DB: ${FLIGHT_DB_NAME}
      POSTGRES_USER: ${FLIGHT_DB_USER}
      POSTGRES_PASSWORD: ${FLIGHT_DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - flight_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FLIGHT_DB_USER} -d ${FLIGHT_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-master:
    image: redis:7-alpine
    container_name: hw3_redis_master
    command: redis-server --port 6379
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-replica:
    image: redis:7-alpine
    container_name: hw3_redis_replica
    command: redis-server --replicaof redis-master 6379
    depends_on:
      redis-master:
        condition: service_healthy

  redis-sentinel:
    image: redis:7-alpine
    container_name: hw3_redis_sentinel
    command: >
      sh -c "
        until MASTER_IP=$$(getent hosts redis-master | awk '{print $$1}') && [ -n \"$$MASTER_IP\" ]; do
          echo 'Waiting for redis-master IP...'; sleep 1;
        done &&
        sed \"s/redis-master/$$MASTER_IP/g\" /etc/redis/sentinel.conf > /tmp/sentinel.conf &&
        echo \"Starting sentinel with redis-master -> $$MASTER_IP\" &&
        redis-sentinel /tmp/sentinel.conf
      "
    volumes:
      - ./sentinel.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica:
        condition: service_started

  booking-migrate:
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    container_name: hw3_booking_migrate
    environment:
      DATABASE_URL: postgresql+asyncpg://${BOOKING_DB_USER}:${BOOKING_DB_PASSWORD}@booking-db/${BOOKING_DB_NAME}
    command: alembic upgrade head
    depends_on:
      booking-db:
        condition: service_healthy

  flight-migrate:
    build:
      context: .
      dockerfile: flight-service/Dockerfile
    container_name: hw3_flight_migrate
    environment:
      DATABASE_URL: postgresql+asyncpg://${FLIGHT_DB_USER}:${FLIGHT_DB_PASSWORD}@flight-db/${FLIGHT_DB_NAME}
    command: alembic upgrade head
    depends_on:
      flight-db:
        condition: service_healthy

  flight-service:
    build:
      context: .
      dockerfile: flight-service/Dockerfile
    container_name: hw3_flight_service
    ports:
      - "50051:50051"
    environment:
      DATABASE_URL: postgresql+asyncpg://${FLIGHT_DB_USER}:${FLIGHT_DB_PASSWORD}@flight-db/${FLIGHT_DB_NAME}
      REDIS_SENTINEL_HOST: redis-sentinel
      REDIS_SENTINEL_PORT: "26379"
      FLIGHT_SERVICE_API_KEY: ${FLIGHT_SERVICE_API_KEY}
      CACHE_TTL: "${CACHE_TTL}"
    depends_on:
      flight-migrate:
        condition: service_completed_successfully
      redis-sentinel:
        condition: service_started
    restart: on-failure

  booking-service:
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    container_name: hw3_booking_service
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${BOOKING_DB_USER}:${BOOKING_DB_PASSWORD}@booking-db/${BOOKING_DB_NAME}
      FLIGHT_SERVICE_HOST: flight-service
      FLIGHT_SERVICE_PORT: "50051"
      FLIGHT_SERVICE_API_KEY: ${FLIGHT_SERVICE_API_KEY}
      CB_FAILURE_THRESHOLD: "${CB_FAILURE_THRESHOLD}"
      CB_TIMEOUT: "${CB_TIMEOUT}"
      CB_WINDOW: "${CB_WINDOW}"
    depends_on:
      booking-migrate:
        condition: service_completed_successfully
      flight-service:
        condition: service_started
    restart: on-failure

volumes:
  booking_postgres_data:
  flight_postgres_data:
