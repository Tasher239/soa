[project]
name = "cinema-unit-tests"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "cinema-shared",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "fastapi>=0.115",
    "httpx>=0.27",
    "prometheus-client>=0.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
