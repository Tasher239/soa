[project]
name = "cinema-tests"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "cinema-shared",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "clickhouse-connect>=0.8",
    "asyncpg>=0.29",
    "confluent-kafka[avro,schemaregistry]>=2.6",
    "prometheus-client>=0.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
