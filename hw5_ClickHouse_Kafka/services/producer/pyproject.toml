[project]
name = "cinema-producer"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "cinema-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "confluent-kafka[avro,schemaregistry]>=2.6",
    "requests>=2.32",
    "httpx>=0.27",
    "tenacity>=9.0",
    "numpy>=2.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
