[project]
name = "cinema-shared"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "prometheus-client>=0.20",
    "fastavro>=1.9",
    "orjson>=3.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["cinema_shared*"]
