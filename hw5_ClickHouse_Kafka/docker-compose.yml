x-kafka-common: &kafka-common
  image: confluentinc/cp-kafka:7.8.0
  environment: &kafka-common-env
    KAFKA_PROCESS_ROLES: "broker,controller"
    KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9094,2@kafka-2:9094,3@kafka-3:9094"
    KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
    KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "2"
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "2"
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    KAFKA_DEFAULT_REPLICATION_FACTOR: "2"
    KAFKA_MIN_INSYNC_REPLICAS: "1"
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    KAFKA_LOG_RETENTION_HOURS: "168"
    CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
    KAFKA_CONTROLLER_QUORUM_ELECTION_TIMEOUT_MS: "5000"
    KAFKA_CONTROLLER_QUORUM_FETCH_TIMEOUT_MS: "4000"
    KAFKA_REQUEST_TIMEOUT_MS: "30000"
    KAFKA_HEAP_OPTS: "-Xms512m -Xmx1g -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
  restart: unless-stopped

services:
  kafka-1:
    <<: *kafka-common
    hostname: kafka-1
    container_name: cinema_kafka_1
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9094"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-1:9092,EXTERNAL://localhost:19092"
    ports:
      - "19092:19092"
    volumes:
      - kafka1_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  kafka-2:
    <<: *kafka-common
    hostname: kafka-2
    container_name: cinema_kafka_2
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19093,CONTROLLER://0.0.0.0:9094"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-2:9092,EXTERNAL://localhost:19093"
    ports:
      - "19093:19093"
    volumes:
      - kafka2_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  kafka-3:
    <<: *kafka-common
    hostname: kafka-3
    container_name: cinema_kafka_3
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19094,CONTROLLER://0.0.0.0:9094"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-3:9092,EXTERNAL://localhost:19094"
    ports:
      - "19094:19094"
    volumes:
      - kafka3_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  schema-registry:
    image: confluentinc/cp-schema-registry:7.8.0
    container_name: cinema_schema_registry
    depends_on:
      kafka-1: {condition: service_healthy}
      kafka-2: {condition: service_healthy}
      kafka-3: {condition: service_healthy}
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "PLAINTEXT://kafka-1:9092,PLAINTEXT://kafka-2:9092,PLAINTEXT://kafka-3:9092"
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: "backward"
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  kafka-init:
    build:
      context: ./infra/kafka-init
    container_name: cinema_kafka_init
    depends_on:
      kafka-1: {condition: service_healthy}
      kafka-2: {condition: service_healthy}
      kafka-3: {condition: service_healthy}
      schema-registry: {condition: service_healthy}
    environment:
      KAFKA_BROKERS: "kafka-1:9092,kafka-2:9092,kafka-3:9092"
      PRIMARY_BROKER: "kafka-1:9092"
      SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      TOPIC: "movie-events"
      PARTITIONS: "6"
      REPLICATION_FACTOR: "2"
      MIN_ISR: "1"
      SCHEMA_FILE: "/schemas/avro/movie_event.avsc"
    volumes:
      - ./schemas:/schemas:ro
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:24.12-alpine
    container_name: cinema_clickhouse
    depends_on:
      kafka-init: {condition: service_completed_successfully}
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    environment:
      CLICKHOUSE_DB: cinema
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./infra/clickhouse/config/config.d:/etc/clickhouse-server/config.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: cinema_postgres
    environment:
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema
      POSTGRES_DB: cinema
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema -d cinema"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  aggregator-migrate:
    build:
      context: .
      dockerfile: services/aggregator/Dockerfile
    container_name: cinema_aggregator_migrate
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DATABASE_URL: "postgresql+asyncpg://cinema:cinema@postgres:5432/cinema"
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: cinema_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2024-11-05T11-29-45Z
    container_name: cinema_minio_init
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      MINIO_URL: "http://minio:9000"
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      BUCKET: "movie-analytics"
    volumes:
      - ./infra/minio-init/init.sh:/init.sh:ro
    restart: "no"

  producer:
    build:
      context: .
      dockerfile: services/producer/Dockerfile
    container_name: cinema_producer
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      schema-registry: {condition: service_healthy}
    environment:
      SERVICE_NAME: "cinema-producer"
      KAFKA_BOOTSTRAP_SERVERS: "kafka-1:9092,kafka-2:9092,kafka-3:9092"
      SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      KAFKA_TOPIC: "movie-events"
      AVRO_SCHEMA_FILE: "/app/schemas/avro/movie_event.avsc"
      GENERATOR_ENABLED: "false"
      GENERATOR_RPS: "150"
      GENERATOR_CONCURRENT_USERS: "50"
      GENERATOR_USER_POOL: "500"
      GENERATOR_MOVIE_POOL: "120"
      LOG_LEVEL: "INFO"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  aggregator:
    build:
      context: .
      dockerfile: services/aggregator/Dockerfile
    container_name: cinema_aggregator
    depends_on:
      aggregator-migrate: {condition: service_completed_successfully}
      clickhouse: {condition: service_healthy}
      postgres: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    environment:
      SERVICE_NAME: "cinema-aggregator"
      DATABASE_URL: "postgresql+asyncpg://cinema:cinema@postgres:5432/cinema"
      CLICKHOUSE_HOST: "clickhouse"
      CLICKHOUSE_HTTP_PORT: "8123"
      CLICKHOUSE_USER: "default"
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DATABASE: "cinema"
      AGGREGATION_CRON: "5 * * * *"
      AGGREGATION_S3_EXPORT_CRON: "30 0 * * *"
      AGGREGATION_TIMEZONE: "UTC"
      S3_ENDPOINT: "http://minio:9000"
      S3_BUCKET: "movie-analytics"
      S3_REGION: "us-east-1"
      S3_ACCESS_KEY: "minioadmin"
      S3_SECRET_KEY: "minioadmin"
      LOG_LEVEL: "INFO"
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  grafana:
    build:
      context: ./infra/grafana
    container_name: cinema_grafana
    depends_on:
      clickhouse: {condition: service_healthy}
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_USERS_DEFAULT_THEME: "dark"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  tests:
    build:
      context: .
      dockerfile: tests/Dockerfile
    container_name: cinema_tests
    profiles: ["test"]
    depends_on:
      producer: {condition: service_healthy}
      aggregator: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
    environment:
      PRODUCER_URL: "http://producer:8000"
      AGGREGATOR_URL: "http://aggregator:8001"
      CLICKHOUSE_URL: "http://clickhouse:8123"
      POSTGRES_DSN: "postgresql://cinema:cinema@postgres:5432/cinema"
      S3_ENDPOINT: "http://minio:9000"
      S3_BUCKET: "movie-analytics"
      S3_ACCESS_KEY: "minioadmin"
      S3_SECRET_KEY: "minioadmin"
      KAFKA_BOOTSTRAP_SERVERS: "kafka-1:9092,kafka-2:9092,kafka-3:9092"
      SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["pytest", "-v", "-ra", "/app/tests"]

volumes:
  kafka1_data:
  kafka2_data:
  kafka3_data:
  clickhouse_data:
  postgres_data:
  minio_data:
  grafana_data:
